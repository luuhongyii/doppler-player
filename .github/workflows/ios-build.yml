name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-simulator:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project DopplerPlayer.xcodeproj \
            -scheme DopplerPlayer \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name 'DopplerPlayer.app' -path '*Debug-iphonesimulator*' 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name 'DopplerPlayer.app' 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "::error::DopplerPlayer.app not found in DerivedData"
            exit 1
          fi
          echo "Found: $APP_PATH"
          cd "$(dirname "$APP_PATH")"
          zip -r "$RUNNER_TEMP/DopplerPlayer-Simulator.zip" "$(basename "$APP_PATH")"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DopplerPlayer-Simulator
          path: ${{ runner.temp }}/DopplerPlayer-Simulator.zip
          retention-days: 14
